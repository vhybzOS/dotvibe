name: Release

on:
  push:
    branches: [main]
    paths: ['deno.json']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (test without creating release)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  packages: write

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from deno.json
        id: version
        run: |
          VERSION=$(jq -r '.version' deno.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🔍 Detected version: $VERSION"

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "🧪 Dry run mode - skipping release check"
          elif gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "⚠️  Release v$VERSION already exists, skipping"
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "✅ Release v$VERSION does not exist, proceeding"
          fi

  build-binaries:
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    strategy:
      matrix:
        target:
          - platform: linux
            arch: x86_64
            deno_target: x86_64-unknown-linux-gnu
          - platform: darwin
            arch: x86_64
            deno_target: x86_64-apple-darwin
          - platform: darwin
            arch: arm64
            deno_target: aarch64-apple-darwin
          - platform: windows
            arch: x86_64
            deno_target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.3

      - name: Build binary
        run: |
          VERSION=${{ needs.detect-version.outputs.version }}
          FILENAME="vibe-v$VERSION-${{ matrix.target.platform }}-${{ matrix.target.arch }}"
          if [ "${{ matrix.target.platform }}" = "windows" ]; then
            FILENAME="$FILENAME.exe"
          fi
          
          echo "🚀 Building $FILENAME for ${{ matrix.target.deno_target }}"
          deno compile --allow-all --include data/ --no-check --target ${{ matrix.target.deno_target }} --output "$FILENAME" src/cli.ts
          
          # Verify binary was created
          ls -la "$FILENAME"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: vibe-v${{ needs.detect-version.outputs.version }}-${{ matrix.target.platform }}-${{ matrix.target.arch }}*
          retention-days: 1

  build-installers:
    runs-on: ubuntu-latest
    needs: [detect-version, build-binaries]
    if: needs.detect-version.outputs.should_release == 'true'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: installer/binaries
          merge-multiple: true

      - name: List downloaded binaries
        run: |
          echo "📦 Downloaded binaries:"
          ls -la installer/binaries/

      - name: Build installers for all platforms
        working-directory: installer
        run: |
          echo "🏗️  Building Go installers for all platforms"
          ~/.local/bin/task build:all

      - name: List built installers
        run: |
          echo "🎁 Built installers:"
          ls -la installer/install-dotvibe-*

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: installer/install-dotvibe-*
          retention-days: 1

  create-release:
    runs-on: ubuntu-latest
    needs: [detect-version, build-binaries, build-installers]
    if: needs.detect-version.outputs.should_release == 'true'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: installers
          path: release-assets

      - name: Generate checksums
        run: |
          cd release-assets
          echo "🔐 Generating checksums for all assets"
          sha256sum * > checksums.txt
          echo "📋 Checksums:"
          cat checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.detect-version.outputs.version }}
          TAG="v$VERSION"
          
          echo "🚀 Creating release $TAG"
          
          # Create release with auto-generated notes
          gh release create "$TAG" \
            --title "dotvibe $TAG" \
            --generate-notes \
            --latest
          
          # Upload all assets
          echo "📦 Uploading release assets"
          gh release upload "$TAG" release-assets/*
          
          echo "✅ Release $TAG created successfully!"
